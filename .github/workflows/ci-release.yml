name: CI & Cross-Platform Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if version tag already exists'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Strict Typecheck, Unit Tests, Security & Version Gate
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Run full unit, crypto, TOTP, parity & formula test suite
        run: npm test

      - name: Run SAST & mobile security audit
        run: npm run audit:security

      - name: Audit production dependencies (advisory report)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Expo public config & plugins
        run: npx expo config --type public > /dev/null

      - name: Check app.json version for new release
        id: version
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ github.event.inputs.force_build || 'false' }}
        run: node scripts/check-version.mjs

  bundle-smoke:
    name: Metro Bundle Verification (${{ matrix.platform }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform: [android, ios, web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export Metro bundle for ${{ matrix.platform }}
        run: |
          npx expo export --platform ${{ matrix.platform }} --output-dir "dist-smoke-${{ matrix.platform }}"
          test -d "dist-smoke-${{ matrix.platform }}"
          BUNDLE_COUNT=$(find "dist-smoke-${{ matrix.platform }}" -type f \( -name "*.js" -o -name "*.hbc" \) | wc -l)
          echo "Generated $BUNDLE_COUNT JS/HBC bundle file(s) for ${{ matrix.platform }}"
          test "$BUNDLE_COUNT" -ge 1

  build-android:
    name: Build & Verify Android APK/AAB
    needs: [check, bundle-smoke]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (Android)
        run: |
          npx expo prebuild --platform android --clean
          echo "org.gradle.caching=true" >> android/gradle.properties

      - name: Build Android APK & AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist-android
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ./gradlew assembleRelease bundleRelease --no-daemon --console=plain \
              -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
              -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
              -PMYAPP_UPLOAD_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
              -PMYAPP_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
              -PMYAPP_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "../dist-android/liquid-notes-v${{ needs.check.outputs.version }}-android.apk"
            cp app/build/outputs/bundle/release/app-release.aab "../dist-android/liquid-notes-v${{ needs.check.outputs.version }}-android.aab"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; building installable debug APK and release AAB."
            ./gradlew assembleDebug bundleRelease --no-daemon --console=plain \
              -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
            cp app/build/outputs/apk/debug/app-debug.apk "../dist-android/liquid-notes-v${{ needs.check.outputs.version }}-android.apk"
            cp app/build/outputs/bundle/release/app-release.aab "../dist-android/liquid-notes-v${{ needs.check.outputs.version }}-android.aab"
          fi

      - name: Verify Android APK & AAB integrity
        run: |
          APK_PATH="dist-android/liquid-notes-v${{ needs.check.outputs.version }}-android.apk"
          AAB_PATH="dist-android/liquid-notes-v${{ needs.check.outputs.version }}-android.aab"
          test -s "$APK_PATH"
          test -s "$AAB_PATH"
          unzip -t "$APK_PATH" >/dev/null
          unzip -t "$AAB_PATH" >/dev/null
          unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml"
          unzip -l "$APK_PATH" | grep -q "classes.dex"
          echo "Verified APK & AAB structure successfully."

      - name: Upload Android APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/*

  build-ios:
    name: Build & Verify iOS IPA
    needs: [check, bundle-smoke]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install || pod install --repo-update
          if [ -f "Pods/fmt/include/fmt/base.h" ]; then
            sed -i '' 's/#  define FMT_USE_CONSTEVAL 1/#  define FMT_USE_CONSTEVAL 0/g' Pods/fmt/include/fmt/base.h
            sed -i '' 's/#define FMT_USE_CONSTEVAL 1/#define FMT_USE_CONSTEVAL 0/g' Pods/fmt/include/fmt/base.h
          fi

      - name: Build iOS Archive & IPA
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          mkdir -p dist-ios
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          if [ -n "$IOS_CERTIFICATE_BASE64" ] && [ -n "$IOS_PROVISION_PROFILE_BASE64" ]; then
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            KEYCHAIN_PASS=$(openssl rand -base64 12)
            echo "$IOS_CERTIFICATE_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
            echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > $RUNNER_TEMP/profile.mobileprovision

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import $RUNNER_TEMP/cert.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

            if ! xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              CLANG_ENABLE_EXPLICIT_MODULES=NO \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
              echo "=== XCODEBUILD ERRORS ==="
              grep -nE "(error:|fatal error:|ARCHIVE FAILED|\*\* )" "$RUNNER_TEMP/xcodebuild.log" | tail -n 80 || true
              echo "=== LAST 120 LINES ==="
              tail -n 120 "$RUNNER_TEMP/xcodebuild.log"
              exit 1
            fi

            cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
          </dict></plist>
          EOF

            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export"

            IPA_FILE=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
            cp "$IPA_FILE" "../dist-ios/liquid-notes-v${{ needs.check.outputs.version }}-ios.ipa"
          else
            echo "No Apple signing secrets found; building unsigned IPA for CI verification/sideloading."
            if ! xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              CLANG_ENABLE_EXPLICIT_MODULES=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
              echo "=== XCODEBUILD ERRORS ==="
              grep -nE "(error:|fatal error:|ARCHIVE FAILED|\*\* )" "$RUNNER_TEMP/xcodebuild.log" | tail -n 80 || true
              echo "=== LAST 120 LINES ==="
              tail -n 120 "$RUNNER_TEMP/xcodebuild.log"
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/Payload"
            APP_DIR=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
            cp -R "$APP_DIR" "$RUNNER_TEMP/Payload/"
            (cd "$RUNNER_TEMP" && zip -qr "unsigned.ipa" Payload)
            cp "$RUNNER_TEMP/unsigned.ipa" "../dist-ios/liquid-notes-v${{ needs.check.outputs.version }}-ios-unsigned.ipa"
          fi

      - name: Verify iOS IPA integrity
        run: |
          IPA_FILE=$(find dist-ios -name "*.ipa" | head -n 1)
          test -s "$IPA_FILE"
          unzip -t "$IPA_FILE" >/dev/null
          unzip -l "$IPA_FILE" | grep -q "Payload/.*\.app/Info.plist"
          echo "Verified IPA structure successfully: $IPA_FILE"

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist-ios/*.ipa

  release:
    name: Publish GitHub Release
    needs: [check, build-android, build-ios]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.check.outputs.should_build == 'true' && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download Android artifact
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download iOS artifact
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets

      - name: Generate version.json & SHA-256 checksums
        run: |
          mkdir -p release-assets
          cat > release-assets/version.json <<EOF
          {
            "version": "${{ needs.check.outputs.version }}",
            "tag": "${{ needs.check.outputs.tag }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}"
          }
          EOF
          (cd release-assets && sha256sum * > checksums-sha256.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: "Liquid Notes ${{ needs.check.outputs.tag }}"
          generate_release_notes: true
          files: release-assets/*

      - name: Cleanup old GitHub releases (keep latest 5)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: '5'
        run: node scripts/cleanup-releases.mjs
